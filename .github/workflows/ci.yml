name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      - name: Run tests
        run: swift test -c debug
