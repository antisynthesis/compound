name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      # Includes two eval gates. Both replay their suite against fakes and
      # compare the result to a committed baseline. Everything runs
      # off-device: a runner without Apple Intelligence still gates.
      #
      #   1. Golden gate — Tests/CompoundTests/GoldenGateTests.swift against
      #      Evals/baseline.json, at pass rate 1.0 with tolerance 0.0.
      #      Regenerate with:
      #        REGENERATE_EVAL_BASELINE=1 swift test --filter GoldenGate
      #
      #   2. Memory gate — Tests/CompoundTests/MemoryGoldenGateTests.swift
      #      against Evals/memory-baseline.json, at pass rate 0.75 with
      #      tolerance 0.0. The threshold is below 1.0 on purpose: the
      #      suite deliberately carries adversarial families (identifier
      #      obfuscation, cross-lingual aliases) that deterministic systems
      #      are known to fail, and the committed baseline records one such
      #      failure today. Tolerance 0.0 is what stops those documented
      #      gaps from widening silently. Regenerate with:
      #        REGENERATE_MEMORY_BASELINE=1 swift test --filter MemoryGoldenGate
      #
      # In both cases, regenerate only to adopt a deliberate behavior
      # change, and commit the baseline diff so a reviewer sees what moved.
      - name: Run tests
        run: swift test -c debug

  examples:
    name: Compile examples (macOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      # The examples are standalone `main.swift` files rather than package
      # targets, because they use the @Generable / @Model macros whose
      # compiler plugins ship only with full Xcode. Adding them as targets
      # would make `swift build` depend on those plugins; type-checking them
      # against the built module keeps the package's build graph unchanged
      # while still catching an example that a source change has broken.
      - name: Build the library
        run: swift build -c debug

      - name: Type-check every example
        shell: bash
        run: |
          set -euo pipefail
          target="$(uname -m)-apple-macos26.0"
          count=0
          while IFS= read -r f; do
            echo "==> $f"
            # -parse-as-library: the files are named main.swift but declare
            # @main types, which top-level-code mode rejects.
            xcrun swiftc -typecheck -swift-version 6 -parse-as-library \
              -target "$target" -I .build/debug "$f"
            count=$((count + 1))
          done < <(find Examples -name '*.swift' | sort)
          if [ "$count" -eq 0 ]; then
            echo "no example sources found under Examples/ — check the path" >&2
            exit 1
          fi
          echo "type-checked $count example file(s)"

  api-diff:
    name: API breakage report (informational)
    runs-on: macos-26
    # Advisory only: Compound is pre-1.0, so an intentional API break is a
    # normal change. This job surfaces what moved for the reviewer; it never
    # blocks the merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Tags and full history are required to diff against a release.
          fetch-depth: 0
          fetch-tags: true

      - name: Diagnose API-breaking changes since the latest tag
        shell: bash
        run: |
          set -uo pipefail
          latest=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "No tags in this repository yet — nothing to diff against."
            echo "This step becomes meaningful once a release is tagged."
            exit 0
          fi
          echo "Comparing the public API against $latest"
          swift package diagnose-api-breaking-changes "$latest"
